<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e1b4b" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Squircle / Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Inner Soft Glow -->
  <rect x="24" y="24" width="464" height="464" rx="96" fill="none" stroke="rgba(255, 255, 255, 0.2)" stroke-width="4" />

  <!-- Center Card Emblem with Shadow -->
  <g filter="url(#shadow)">
    <rect x="76" y="86" width="360" height="340" rx="36" fill="#ffffff" fill-opacity="0.12" stroke="rgba(255, 255, 255, 0.35)" stroke-width="3" />
  </g>

  <!-- Group Icon: Badge Symbol (User / Shield) -->
  <g transform="translate(256, 175) scale(1.15)">
    <!-- Main User Head -->
    <circle cx="0" cy="-28" r="32" fill="#ffffff" />
    <!-- Main User Body / Collar -->
    <path d="M -54,34 C -54,2 -28,-8 0,-8 C 28,-8 54,2 54,34 C 54,40 48,46 40,46 L -40,46 C -48,46 -54,40 -54,34 Z" fill="#ffffff" />
    <!-- Checkmark Badge on shoulder -->
    <circle cx="38" cy="22" r="16" fill="#10b981" stroke="#4f46e5" stroke-width="3" />
    <path d="M 32,22 L 36,26 L 44,17" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Typographic Mark "CFC" -->
  <text x="256" y="342" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-size="76" font-weight="900" fill="#ffffff" letter-spacing="4">CFC</text>

  <!-- Subtitle -->
  <text x="256" y="380" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="600" fill="#c7d2fe" letter-spacing="1">CONTROLE DE FUNCIONÁRIOS</text>
</svg>
