<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CFC - Controle Funcionário Completo</title>
    <meta name="description" content="CFC - Controle Funcionário Completo. Gestão limpa, moderna e minimalista de funcionários, prazos de experiência e controle de férias CLT." />
    <meta property="og:title" content="CFC - Controle Funcionário Completo" />
    <meta property="og:description" content="CFC - Controle Funcionário Completo. Gestão limpa, moderna e minimalista de funcionários, prazos de experiência e controle de férias CLT." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA e Meta Tags de Aplicativo Mobile -->
    <meta name="theme-color" content="#4f46e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CFC" />
    <meta name="application-name" content="CFC" />

    <!-- Manifest e Ícones PWA -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-900 antialiased selection:bg-indigo-500 selection:text-white transition-colors duration-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Registro do Service Worker para PWA Offline e Instalação -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker
            .register('/sw.js')
            .then((registration) => {
              console.log('Service Worker CFC registrado com sucesso:', registration.scope);
            })
            .catch((error) => {
              console.error('Falha ao registrar Service Worker CFC:', error);
            });
        });
      }
    </script>
  </body>
</html>
